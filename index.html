<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nimet Scout Shop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Testing CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen text-gray-800 flex flex-col justify-between antialiased selection:bg-purple-200">

    <!-- ================= FIXED TOP HEADER ================= -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-[#7414DC] text-white px-4 py-3 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-2.5 cursor-pointer" onclick="switchTab('home')">
            <img src="assets/logo/nimet-scout-store-logo.svg" alt="Nimet Scout Shop" class="w-11 h-11 shrink-0 object-contain"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <!-- shown only if the logo file is missing -->
            <div class="w-9 h-9 rounded-2xl bg-[#F4A81E] text-white items-center justify-center font-bold text-base shadow-sm shrink-0" style="display:none">
                <i class="fa-solid fa-compass"></i>
            </div>
            <div>
                <h1 class="font-black text-sm tracking-wide leading-tight" data-i18n="app_name">Nimet Scout Shop</h1>
                <p class="text-[9px] text-amber-200 font-semibold tracking-wider uppercase" data-i18n="app_tagline">Official Gear & Custom Woggles</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Language Switcher Sliding Pill -->
            <div class="bg-black/20 backdrop-blur-sm border border-white/20 rounded-full p-1 flex items-center relative cursor-pointer select-none shadow-inner" onclick="toggleLanguage()">
                <div id="lang-slider-pill" class="absolute top-1 bottom-1 left-[62px] w-[56px] bg-[#F4A81E] rounded-full transition-all duration-300 ease-out shadow-md"></div>
                <button id="lang-btn-en" class="relative z-10 w-[56px] py-1 text-[11px] font-black tracking-wider transition-colors duration-300 text-purple-200 flex items-center justify-center gap-1">
                    <span>🇬🇧</span> EN
                </button>
                <button id="lang-btn-kh" class="relative z-10 w-[56px] py-1 text-[11px] font-black tracking-wider transition-colors duration-300 text-gray-900 flex items-center justify-center gap-1">
                    <span>🇰🇭</span> KH
                </button>
            </div>

            <!-- Cart Button -->
            <button onclick="toggleCartModal(true)" class="relative w-10 h-10 bg-white/10 hover:bg-white/20 rounded-2xl flex items-center justify-center transition-all active:scale-95">
                <i class="fa-solid fa-cart-shopping text-white text-base"></i>
                <span id="header-cart-badge" class="absolute -top-1 -right-1 bg-[#F4A81E] text-gray-900 font-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center border-2 border-[#7414DC] shadow-sm">0</span>
            </button>
        </div>
    </header>

    <!-- ================= MAIN SCROLLABLE CONTENT AREA ================= -->
    <main class="w-full max-w-lg mx-auto flex-1 pt-[6.5rem] pb-28 px-4">
        <section id="tab-home-view" class="space-y-4">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xl font-black uppercase tracking-wide text-purple-900" data-i18n="home_title">Latest Updates</h2>
            </div>
            <div id="news-feed" class="space-y-3"></div>
        </section>

        <section id="tab-woggle-view" class="space-y-5 hidden">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xl font-black uppercase tracking-wide text-purple-900" data-i18n="woggle_title">Scout Woggles Collection</h2>
            </div>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none"></i>
                <input type="text" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" data-search="woggle" placeholder="Search woggle..." data-i18n-placeholder="search_woggle" aria-label="Search woggle" class="w-full pl-10 pr-11 py-2 rounded-2xl border border-purple-100 bg-white text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7414DC]/40">
                <button type="button" data-action="clear-search" data-section="woggle" aria-label="Clear search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-gray-100 text-gray-500 items-center justify-center active:scale-95" style="min-height:0"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-3" id="woggle-products-grid"></div>
        </section>

        <section id="tab-shop-view" class="space-y-5 hidden">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xl font-black uppercase tracking-wide text-purple-900" data-i18n="shop_title">General Gear</h2>
            </div>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none"></i>
                <input type="text" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" data-search="shop" placeholder="Search shop..." data-i18n-placeholder="search_shop" aria-label="Search shop" class="w-full pl-10 pr-11 py-2 rounded-2xl border border-purple-100 bg-white text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7414DC]/40">
                <button type="button" data-action="clear-search" data-section="shop" aria-label="Clear search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-gray-100 text-gray-500 items-center justify-center active:scale-95" style="min-height:0"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-3" id="shop-products-grid"></div>
        </section>

        <section id="tab-pin-view" class="space-y-5 hidden">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xl font-black uppercase tracking-wide text-purple-900" data-i18n="pin_title">Scout Pins</h2>
            </div>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none"></i>
                <input type="text" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" data-search="pin" placeholder="Search pin..." data-i18n-placeholder="search_pin" aria-label="Search pin" class="w-full pl-10 pr-11 py-2 rounded-2xl border border-purple-100 bg-white text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7414DC]/40">
                <button type="button" data-action="clear-search" data-section="pin" aria-label="Clear search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-gray-100 text-gray-500 items-center justify-center active:scale-95" style="min-height:0"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-3" id="pin-products-grid"></div>
        </section>

        <section id="tab-badge-view" class="space-y-5 hidden">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xl font-black uppercase tracking-wide text-purple-900" data-i18n="badge_title">Scout Badges</h2>
            </div>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none"></i>
                <input type="text" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" data-search="badge" placeholder="Search badge..." data-i18n-placeholder="search_badge" aria-label="Search badge" class="w-full pl-10 pr-11 py-2 rounded-2xl border border-purple-100 bg-white text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7414DC]/40">
                <button type="button" data-action="clear-search" data-section="badge" aria-label="Clear search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-gray-100 text-gray-500 items-center justify-center active:scale-95" style="min-height:0"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-3" id="badge-products-grid"></div>
        </section>
    </main>

    <!-- ================= BOTTOM NAVIGATION BAR ================= -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-purple-100 shadow-md px-2 py-2">
        <div class="max-w-lg mx-auto grid grid-cols-5 gap-0.5">
            <button onclick="switchTab('home')" id="nav-btn-home" class="py-1.5 flex flex-col items-center justify-center text-center transition-all rounded-2xl text-[#7414DC]">
                <div class="h-5 flex items-center justify-center mb-0.5"><i class="fa-solid fa-house text-base"></i></div>
                <span class="text-[10px] font-bold" data-i18n="nav_home">Home</span>
            </button>
            <button onclick="switchTab('shop')" id="nav-btn-shop" class="py-1.5 flex flex-col items-center justify-center text-center transition-all rounded-2xl text-gray-400 hover:text-[#7414DC]">
                <div class="h-5 flex items-center justify-center mb-0.5"><i class="fa-solid fa-store text-base"></i></div>
                <span class="text-[10px] font-bold" data-i18n="nav_shop">Shop</span>
            </button>
            <button onclick="switchTab('woggle')" id="nav-btn-woggle" class="py-1.5 flex flex-col items-center justify-center text-center transition-all rounded-2xl text-gray-400 hover:text-[#7414DC]">
                <div class="h-5 flex items-center justify-center mb-0.5">
                    <svg class="nav-icon-svg" viewBox="0 0 661.48 661.48" data-icon="scout"></svg>
                </div>
                <span class="text-[10px] font-bold" data-i18n="nav_woggle">Woggle</span>
            </button>
            <button onclick="switchTab('pin')" id="nav-btn-pin" class="py-1.5 flex flex-col items-center justify-center text-center transition-all rounded-2xl text-gray-400 hover:text-[#7414DC]">
                <div class="h-5 flex items-center justify-center mb-0.5">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.7 2 6 4.7 6 8C6 11.5 9 14.5 11 16.2V21C11 21.6 11.4 22 12 22C12.6 22 13 21.6 13 21V16.2C15 14.5 18 11.5 18 8C18 4.7 15.3 2 12 2ZM12 14.2C10.3 12.7 8 10.3 8 8C8 5.8 9.8 4 12 4C14.2 4 16 5.8 16 8C16 10.3 13.7 12.7 12 14.2ZM12 6C10.9 6 10 6.9 10 8C10 9.1 10.9 10 12 10C13.1 10 14 9.1 14 8C14 6.9 13.1 6 12 6Z"/></svg>
                </div>
                <span class="text-[10px] font-bold" data-i18n="nav_pin">Pin</span>
            </button>
            <button onclick="switchTab('badge')" id="nav-btn-badge" class="py-1.5 flex flex-col items-center justify-center text-center transition-all rounded-2xl text-gray-400 hover:text-[#7414DC]">
                <div class="h-5 flex items-center justify-center mb-0.5"><i class="fa-solid fa-shield-halved text-base"></i></div>
                <span class="text-[10px] font-bold" data-i18n="nav_badge">Badge</span>
            </button>
        </div>
    </nav>

    <!-- Woggle Customizer Modal (one per style, filled in by app.js) -->
    <div id="woggle-customizer-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end justify-center hidden">
        <div id="woggle-modal-sheet" class="bg-white w-full max-w-lg rounded-t-3xl max-h-[92vh] overflow-y-auto animate-slide-up" style="padding-bottom: env(safe-area-inset-bottom);">
            <!-- Sticky title bar -->
            <div class="sticky top-0 z-10 bg-white flex justify-between items-center px-5 py-3 border-b">
                <h3 id="woggle-modal-title" class="font-black text-sm text-gray-900">Woggle</h3>
                <button onclick="closeWoggleModal()" aria-label="Close" class="w-9 h-9 min-h-0 flex items-center justify-center rounded-xl text-gray-500 active:bg-gray-100"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="p-5 space-y-4">
                <!-- Square preview image on top -->
                <div id="woggle-modal-picture" class="w-full aspect-square bg-purple-50 rounded-3xl overflow-hidden relative flex items-center justify-center border border-purple-100 mx-auto" style="max-width: min(100%, 42vh);">
                    <img id="woggle-modal-image" src="" alt="Woggle preview" class="w-full h-full object-cover">
                    <div id="woggle-modal-fallback" class="w-full h-full items-center justify-center" style="display:none;"></div>
                </div>

                <div id="woggle-selected-row" class="flex items-baseline justify-between">
                    <p id="woggle-selected-label" class="text-[11px] font-bold text-gray-500 uppercase" data-i18n="optionselected_color">Selected color</p>
                    <p id="woggle-modal-color-name" class="text-sm font-black text-[#7414DC]"></p>
                </div>

                <div id="woggle-options-block">
                    <label id="woggle-options-label" class="text-[11px] font-bold text-gray-500 uppercase block mb-1" data-i18n="optiontitle_color">1. Color</label>
                    <div id="woggle-color-selector" class="grid grid-cols-3 gap-2"></div>
                </div>

                <div id="woggle-name-wrapper">
                    <label for="woggle-custom-name" class="text-[11px] font-bold text-gray-500 uppercase block mb-1" data-i18n="modal_name_label">2. Name</label>
                    <input type="text" id="woggle-custom-name" placeholder="Enter name" data-i18n-placeholder="modal_name_placeholder" class="w-full px-3 py-2 border rounded-xl text-base">
                </div>

                <!-- Quantity: minus / number / plus -->
                <div class="flex items-center justify-center gap-5">
                    <button type="button" data-action="modal-qty" data-change="-1" aria-label="Decrease quantity" class="w-12 h-12 rounded-2xl bg-gray-100 text-gray-800 text-lg flex items-center justify-center active:scale-95 transition-all"><i class="fa-solid fa-minus"></i></button>
                    <span id="woggle-modal-qty" class="min-w-[3rem] text-center text-2xl font-black text-gray-900">1</span>
                    <button type="button" data-action="modal-qty" data-change="1" aria-label="Increase quantity" class="w-12 h-12 rounded-2xl bg-[#7414DC] text-white text-lg flex items-center justify-center active:scale-95 transition-all"><i class="fa-solid fa-plus"></i></button>
                </div>

                <button id="btn-add-custom-woggle" class="w-full py-3 bg-[#7414DC] text-white font-bold rounded-xl text-sm active:scale-[0.98] transition-all">
                    <span data-i18n="modal_add_to_cart">Add to Cart</span> • <span id="woggle-modal-price"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end justify-center hidden">
        <div class="bg-white w-full max-w-lg rounded-t-3xl max-h-[90vh] flex flex-col overflow-hidden animate-slide-up">
            <div class="px-5 py-3 bg-[#7414DC] text-white flex justify-between items-center">
                <h3 class="font-bold text-sm" data-i18n="cart_title">Cart & Receipt</h3>
                <button onclick="toggleCartModal(false)" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 flex-1 overflow-y-auto space-y-4">
                <div id="cart-items-container" class="space-y-2"></div>

                <!-- Receiver details (also printed in the receipt and the PDF) -->
                <div class="space-y-2">
                    <h4 class="text-[11px] font-bold text-gray-500 uppercase" data-i18n="cart_receiver_title">Receiver Details</h4>
                    <input type="text" id="receiver-name" data-receiver="name" autocomplete="off" placeholder="Receiver Name" data-i18n-placeholder="cart_receiver_name" class="w-full px-3 py-2 border rounded-xl text-base">
                    <!-- Where the customer ordered from: shown after the name, e.g. "Sophie (TikTok)" -->
                    <div class="grid grid-cols-3 gap-2" id="source-selector">
                        <button type="button" data-action="select-source" data-value="page" class="py-2 px-1 text-xs font-bold rounded-xl border transition-all flex items-center justify-center gap-1.5 bg-gray-50 text-gray-700 border-gray-200"><i class="fa-brands fa-facebook"></i><span data-i18n="source_page">Page</span></button>
                        <button type="button" data-action="select-source" data-value="telegram" class="py-2 px-1 text-xs font-bold rounded-xl border transition-all flex items-center justify-center gap-1.5 bg-gray-50 text-gray-700 border-gray-200"><i class="fa-brands fa-telegram"></i><span data-i18n="source_telegram">Telegram</span></button>
                        <button type="button" data-action="select-source" data-value="tiktok" class="py-2 px-1 text-xs font-bold rounded-xl border transition-all flex items-center justify-center gap-1.5 bg-gray-50 text-gray-700 border-gray-200"><i class="fa-brands fa-tiktok"></i><span data-i18n="source_tiktok">TikTok</span></button>
                    </div>
                    <input type="tel" id="receiver-phone" data-receiver="phone" inputmode="tel" autocomplete="tel" placeholder="Receiver Phone Number" data-i18n-placeholder="cart_receiver_phone" class="w-full px-3 py-2 border rounded-xl text-base">
                    <textarea id="receiver-address" data-receiver="address" rows="2" autocomplete="street-address" placeholder="Receiver Address" data-i18n-placeholder="cart_receiver_address" class="w-full px-3 py-2 border rounded-xl text-base"></textarea>
                    <p class="text-[11px] font-bold text-gray-500 uppercase pt-1" data-i18n="cart_delivery_title">Delivery Method</p>
                    <div class="grid grid-cols-2 gap-2" id="delivery-selector">
                        <button type="button" data-action="select-delivery" data-value="vet" class="py-2 px-2 text-xs font-bold rounded-xl border transition-all bg-gray-50 text-gray-700 border-gray-200"><span data-i18n="delivery_vet">VET</span><span class="block text-[10px] font-semibold opacity-70" data-delivery-fee></span></button>
                        <button type="button" data-action="select-delivery" data-value="jt" class="py-2 px-2 text-xs font-bold rounded-xl border transition-all bg-gray-50 text-gray-700 border-gray-200"><span data-i18n="delivery_jt">J&amp;T</span><span class="block text-[10px] font-semibold opacity-70" data-delivery-fee></span></button>
                        <button type="button" data-action="select-delivery" data-value="delivery" class="py-2 px-2 text-xs font-bold rounded-xl border transition-all bg-gray-50 text-gray-700 border-gray-200"><span data-i18n="delivery_delivery">Delivery</span><span class="block text-[10px] font-semibold opacity-70" data-delivery-fee></span></button>
                        <button type="button" data-action="select-delivery" data-value="pickup" class="py-2 px-2 text-xs font-bold rounded-xl border transition-all bg-gray-50 text-gray-700 border-gray-200"><span data-i18n="delivery_pickup">Pick up</span><span class="block text-[10px] font-semibold opacity-70" data-delivery-fee></span></button>
                    </div>
                    <!-- Price choices of the Delivery method (filled by app.js) -->
                    <div id="delivery-sub" class="hidden grid grid-cols-3 gap-2"></div>
                    <p id="delivery-fee-hint" class="hidden text-[11px] font-semibold text-amber-600" data-i18n="delivery_choose_fee">Please choose a delivery fee</p>
                </div>
                <div class="bg-gray-900 text-emerald-400 p-3 rounded-xl font-mono text-xs">
                    <pre id="receipt-formatted-output" class="whitespace-pre-wrap">Cart is empty.</pre>
                </div>
                <button id="copy-receipt-btn" class="w-full py-3 bg-[#80BE43] text-gray-900 font-bold rounded-xl text-xs" data-i18n="cart_copy_receipt">Copy Receipt</button>
                <button id="checkout-btn" class="w-full py-3 bg-[#7414DC] text-white font-bold rounded-xl text-xs shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span data-i18n="cart_checkout">Check Out</span>
                </button>
                <!-- Owner tool: small and quiet so customers do not tap it by accident -->
                <div class="flex justify-end gap-1">
                    <button id="print-btn" class="px-2 py-1 rounded-md text-[10px] text-gray-300 hover:text-gray-500 flex items-center gap-1" style="min-height:0"><i class="fa-solid fa-print"></i><span data-i18n="cart_print">Print</span></button>
                    <button id="export-pdf-btn" class="px-2 py-1 rounded-md text-[10px] text-gray-300 hover:text-gray-500 flex items-center gap-1" style="min-height:0"><i class="fa-solid fa-file-pdf"></i><span data-i18n="cart_export_pdf">Export PDF</span></button>
                </div>
            </div>
            <div class="p-3 bg-gray-50 border-t flex justify-between items-center">
                <p class="font-black text-lg" id="cart-total-price">$0.00</p>
                <button id="btn-clear-cart" class="px-3 py-1.5 bg-rose-100 text-rose-700 font-bold text-xs rounded-lg" data-i18n="cart_clear">Clear Cart</button>
            </div>
        </div>
    </div>

    <!-- Small question dialog with up to 3 buttons (used by Clear Cart: Save / Discard / Cancel) -->
    <div id="choice-modal" class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 animate-slide-up">
            <p id="choice-message" class="text-sm font-bold text-gray-900 leading-relaxed text-center"></p>
            <div id="choice-buttons" class="space-y-2"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white px-4 py-2 rounded-xl text-xs font-semibold opacity-0 pointer-events-none transition-all duration-300">
        <span id="toast-text">Action completed</span>
    </div>

    <!-- Main JavaScript App Entry -->
    <script type="module" src="js/app.js"
        onerror="document.body.insertAdjacentHTML('afterbegin','<div style=&quot;position:fixed;top:0;left:0;right:0;z-index:9999;background:#be123c;color:#fff;padding:12px;font:13px sans-serif&quot;>App failed to load. A file is missing or misnamed: check that the js/ and data/ folders (app.js, cart.js, currency.js, products.js, catalog.js, news.js) are all uploaded, then hard-refresh.</div>')"></script>
</body>
</html>
